name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package
        run: python -m pip install .
      - name: Unit tests
        run: python -m unittest discover -s tests/unit -v
      - name: Integration tests with local HTTP API
        run: python -m unittest discover -s tests/integration -v
      - name: Check installed CLI
        working-directory: ${{ runner.temp }}
        run: webdriver-vision --help

  browser:
    name: Chrome integration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package
        run: python -m pip install .
      - name: Check Chrome
        run: google-chrome --version
      - name: Test installed package with Chrome and local HTTP API
        working-directory: ${{ runner.temp }}
        env:
          WEBDRIVER_VISION_BROWSER_TESTS: "1"
          SE_CACHE_PATH: ${{ runner.temp }}/selenium
        run: python -m unittest discover -s "$GITHUB_WORKSPACE/tests/integration" -v
