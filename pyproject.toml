[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "webdriver-vision"
version = "0.1.0"
description = "Analyze Selenium screenshots with an AI vision API."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Yuliya", email = "yuliya.svirska@gmail.com" }]
dependencies = ["PyYAML>=6,<7", "Pillow>=10", "selenium>=4.10,<5"]

[tool.setuptools.packages.find]
include = ["webdriver_vision*"]
namespaces = false
