services:
  vision:
    build: .
    entrypoint:
      - webdriver-vision
      - --remote-url
      - http://browser:4444
      - --config
      - /app/config.yaml
    command: ["--help"]
    environment:
      AI_API_KEY: ${AI_API_KEY:-}
    volumes:
      - type: bind
        source: ${VISION_CONFIG:-./config.yaml}
        target: /app/config.yaml
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      browser:
        condition: service_healthy

  browser:
    image: selenium/standalone-chromium:4.52.0-20261101
    shm_size: 2gb
    environment:
      SE_NODE_MAX_SESSIONS: "1"
      SE_START_XVFB: "true"
      SE_START_VNC: "false"
      SE_START_NO_VNC: "false"
    healthcheck:
      test: ["CMD", "/opt/bin/check-grid.sh", "--host", "0.0.0.0", "--port", "4444"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 20s
